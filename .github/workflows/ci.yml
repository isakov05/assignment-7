name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: transcript-manager

      - name: TypeScript compile check
        run: npx tsc --noEmit
        working-directory: transcript-manager

      - name: Run ESLint
        run: npm run lint
        working-directory: transcript-manager

      - name: Run Jest Tests
        run: npm test
        working-directory: transcript-manager
